<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" font-family="Arial, sans-serif"><rect width="1120" height="360" fill="#fff"/><text x="32" y="40" font-size="21" font-weight="bold">Целевой IN через трейдера — требуется реализация</text><g fill="#fff6ea" stroke="#f6821f" stroke-width="2"><rect x="32" y="85" width="220" height="92"/><rect x="307" y="85" width="220" height="92"/><rect x="582" y="85" width="220" height="92"/><rect x="857" y="85" width="230" height="92"/></g><g font-size="16" fill="#222"><text x="48" y="117">Core назначает сделку</text><text x="48" y="145">и занимает реквизит</text><text x="323" y="117">Плательщик переводит</text><text x="323" y="145">фиат на реквизит</text><text x="598" y="117">Устройство передаёт</text><text x="598" y="145">банковский сигнал</text><text x="873" y="117">Платформа сопоставляет</text><text x="873" y="145">и обновляет сделку</text><text x="270" y="135">→</text><text x="545" y="135">→</text><text x="820" y="135">→</text></g><rect x="207" y="232" width="705" height="92" fill="#e6eefc" stroke="#2f6fe0"/><text x="225" y="263" font-size="16">Неоднозначный сигнал → проверка в ЛК трейдера/оператора платформы.</text><text x="225" y="291" font-size="16">Telegram: уведомление и ссылка в ЛК, без действий по сделке.</text></svg>